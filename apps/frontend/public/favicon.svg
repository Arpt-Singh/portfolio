<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="170 150 920 920" role="img" aria-labelledby="title desc">
  <title id="title">Neon Circuit A Emblem</title>
  <desc id="desc">Neon letter A with cyan to violet gradients on a dark navy rounded background.</desc>
  <defs>
    <linearGradient id="metal" x1="430" y1="420" x2="920" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#68ffff"/>
      <stop offset=".28" stop-color="#00b8ff"/>
      <stop offset=".53" stop-color="#6495ff"/>
      <stop offset=".79" stop-color="#b07aff"/>
      <stop offset="1" stop-color="#d244ff"/>
    </linearGradient>
    <linearGradient id="left" x1="360" y1="610" x2="555" y2="795" gradientUnits="userSpaceOnUse">
      <stop stop-color="#68ffff"/>
      <stop offset=".42" stop-color="#00c9ff"/>
      <stop offset=".73" stop-color="#6495ff"/>
      <stop offset="1" stop-color="#b13aff"/>
    </linearGradient>
    <linearGradient id="rim" x1="397" y1="360" x2="975" y2="915" gradientUnits="userSpaceOnUse">
      <stop stop-color="#84ffff"/>
      <stop offset=".43" stop-color="#00c8ff"/>
      <stop offset=".72" stop-color="#4147ff"/>
      <stop offset="1" stop-color="#d455ff"/>
