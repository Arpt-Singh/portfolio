      <path d="M631 267 821 605 745 658 581 355Z" fill="url(#metal)" stroke="url(#rim)" stroke-width="3"/>
      <path d="M581 355 389 674 399 699 265 928 384 878 461 734 541 734 742 675 727 673 399 673 530 453Z" fill="url(#left)" stroke="url(#rim)" stroke-width="5"/>
      <path d="M581 373 409 668 459 668 609 405" fill="none" stroke="#00baff" stroke-width="7"/>
      <path d="M601 399 557 470 535 483 493 559 431 668" fill="none" stroke="#79ffff" stroke-width="6" stroke-linejoin="round"/>
      <path d="M619 426 575 495 555 507 466 669" fill="none" stroke="#008cff" stroke-width="9" stroke-linejoin="round"/>
      <path d="M776 699 824 782 866 798 913 881" fill="none" stroke="url(#cyan)" stroke-width="7" stroke-linejoin="round"/>
      <path d="M793 692 843 763 880 781 922 856 953 876" fill="none" stroke="#5b27ee" stroke-width="6" stroke-linejoin="round"/>
      <path d="M747 746 790 816 833 836 885 905" fill="none" stroke="url(#cyan)" stroke-width="8" stroke-linejoin="round"/>
      <g fill="#07152f" stroke="url(#rim)" stroke-width="6">
        <circle cx="576" cy="441" r="10"/>
        <circle cx="491" cy="566" r="11"/>
        <circle cx="747" cy="746" r="12"/>
        <circle cx="832" cy="836" r="12"/>
        <circle cx="913" cy="882" r="11"/>
      </g>
    </g>
